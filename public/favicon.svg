<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle container background for high contrast on both dark & light browser tabs -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#0284c7" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)"/>

  <!-- Centered Skyline Building Symbol (Exact from Logo.tsx) -->
  <g transform="translate(76, 86) scale(3.0)" filter="url(#glow)">
    <!-- Background buildings -->
    <path d="M42 35 L42 75 L52 75 L52 35 Z" fill="#0284c7" opacity="0.85" />
    <path d="M68 25 L68 75 L78 75 L78 25 Z" fill="#0369a1" />
    <path d="M30 48 L30 75 L40 75 L40 48 Z" fill="#38bdf8" />
    
    <!-- Center tall buildings -->
    <path d="M55 12 L65 5 L65 75 L55 75 Z" fill="#0284c7" />
    <path d="M45 22 L55 15 L55 75 L45 75 Z" fill="#2563eb" />
    <path d="M80 42 L90 50 L90 75 L80 75 Z" fill="#0284c7" />

    <!-- Windows grid lines (Bright White) -->
    <line x1="47" y1="30" x2="53" y2="30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="47" y1="40" x2="53" y2="40" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="47" y1="50" x2="53" y2="50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="47" y1="60" x2="53" y2="60" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    
    <line x1="58" y1="20" x2="63" y2="20" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="58" y1="30" x2="63" y2="30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="58" y1="40" x2="63" y2="40" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="58" y1="50" x2="63" y2="50" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <line x1="58" y1="60" x2="63" y2="60" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Base stylized ocean / foundation waves -->
    <path d="M14 78 C35 70, 56 86, 76 76 C92 68, 105 82, 110 78" stroke="#38bdf8" stroke-width="3.8" stroke-linecap="round" fill="none" />
    <path d="M20 86 C40 78, 64 94, 84 84 C96 77, 104 88, 108 85" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round" fill="none" />
  </g>
</svg>
